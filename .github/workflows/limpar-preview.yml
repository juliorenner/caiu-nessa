name: limpar-preview

# Branch apagada (merge com --delete-branch, ou à mão): apaga os deploys de preview dela na Vercel.
# A integração do Neon (gerenciada pela Vercel) apaga o branch do banco `preview/<branch>` quando o último
# deploy ligado a ele some; sem isso, os branches do Neon se acumulam até o limite do plano e todo preview
# novo falha com "Resource provisioning failed".
# O evento `delete` roda a partir de main: o ambiente production (só branches protegidas) libera os segredos.
on:
  delete:

permissions: {}

jobs:
  limpar:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BRANCH: ${{ github.event.ref }}
    steps:
      # API REST em vez do CLI: sem a pasta .vercel, o CLI com token não acha o projeto.
      - name: Apagar os previews da branch
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          api=https://api.vercel.com
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          # Lista todos os previews do projeto (paginado) e fica com os da branch apagada.
          ids=""
          ate=""
          while :; do
            pagina=$(curl -fsS "${auth[@]}" \
              "$api/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=preview&limit=100${ate:+&until=$ate}")
            ids+=" $(printf '%s' "$pagina" | jq -r --arg b "$BRANCH" \
              '.deployments[] | select(.target != "production" and .meta.githubCommitRef == $b) | .uid')"
            ate=$(printf '%s' "$pagina" | jq -r '.pagination.next // empty')
            [ -z "$ate" ] && break
          done
          total=0
          for id in $ids; do
            curl -fsS -X DELETE "${auth[@]}" "$api/v13/deployments/$id?teamId=$VERCEL_ORG_ID" > /dev/null
            total=$((total + 1))
          done
          echo "Previews apagados da branch $BRANCH: $total" >> "$GITHUB_STEP_SUMMARY"
