name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Chamado pelo deploy.yml, um push mais novo em main pode cancelar o CI da execução anterior (vence o commit
# mais novo); o job deploy em si nunca é cancelado. Comportamento a confirmar nos primeiros pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Só dependências de produção: as de desenvolvimento (eslint-config-next, drizzle-kit) têm alertas sem correção
      # publicada e não vão para o site.
      - run: npm audit --omit=dev --audit-level=high

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          arquivo="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${arquivo}"
          echo "${ACTIONLINT_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "${arquivo}" actionlint
          ./actionlint -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .github/workflows

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # o gitleaks lista os commits do PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Comentar no PR exigiria pull-requests: write; o resultado já aparece no job.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Só nas PRs do bot de revisão de fatos: a revisão respeita os limites, os links em jogo respondem
  # e (como aviso no resumo) as citações aparecem nas páginas das agências.
  revisao:
    if: startsWith(github.head_ref, 'bot/revisao-de-fatos-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validar a revisão contra a base
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npx tsx scripts/validar-revisao.ts
      - name: Acessar cada link de checagem em jogo
        run: npx tsx scripts/verificar-fontes.ts
      - name: Conferir as citações nas páginas (aviso)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          {
            echo '## Citações nas páginas das agências (itens novos ou alterados)'
            echo '```'
            npx tsx scripts/conferir-citacoes.ts
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    if: always()
    needs: [verificar, auditoria, workflows, segredos, revisao]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir os jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
          REVISAO: ${{ needs.revisao.result }}
        run: |
          # O job revisao só roda nas PRs do bot: pulado conta como ok, qualquer outro job pulado não.
          for resultado in $RESULTADOS; do
            if [ "$resultado" = skipped ] && [ "$REVISAO" = skipped ]; then
              REVISAO=contado
              continue
            fi
            if [ "$resultado" != success ]; then
              echo "::error::Um job do CI terminou com: $resultado"
              exit 1
            fi
          done
