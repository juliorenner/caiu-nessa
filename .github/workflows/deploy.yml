name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  ci:
    # actionlint 1.7.12 ainda não aceita a sintaxe $/ que o zizmor sugere.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read # repassado ao job segredos do ci

  deploy:
    needs: ci
    # O workflow_dispatch pode ser disparado de qualquer branch; só main vai para produção.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_CLI: vercel@62.7.0
    # Segredos só nos passos que usam: checkout, setup-node e npm ci não os recebem.
    steps:
      - name: Segredos configurados?
        id: configurado
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "ok=$([ -n "$VERCEL_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Deploy pulado: segredos da Vercel ainda não cadastrados"
          fi
      - if: steps.configurado.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.configurado.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Sem cache no job que publica: evita restaurar um cache que outro workflow possa ter gravado.
          package-manager-cache: false
      - if: steps.configurado.outputs.ok == 'true'
        run: npm ci
      - if: steps.configurado.outputs.ok == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.configurado.outputs.ok == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - if: steps.configurado.outputs.ok == 'true'
        name: Migrar o banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate
      - if: steps.configurado.outputs.ok == 'true'
        name: Publicar
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deploy: $url" >> "$GITHUB_STEP_SUMMARY"

  fumaca:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Sem segredos: só lê o site publicado (E2E_SOMENTE_LEITURA pula a rodada inteira, que grava no banco).
    steps:
      - name: Esperar o site responder
        run: |
          for _ in $(seq 1 12); do curl -sf -o /dev/null https://caiunessa.com.br/ && exit 0; sleep 10; done
          echo "::error::site não respondeu"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fumaça contra produção
        env:
          E2E_BASE_URL: https://caiunessa.com.br
          E2E_SOMENTE_LEITURA: '1'
        run: npm run e2e
      - name: Guardar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          # No CI o reporter é list + github (sem HTML); os traces da nova tentativa ficam em test-results/.
          path: |
            playwright-report/
            test-results/
