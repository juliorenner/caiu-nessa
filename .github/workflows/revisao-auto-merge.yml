name: revisao-auto-merge

# Só para as PRs do bot de revisão de fatos (branch bot/revisao-de-fatos-*): liga o auto-merge ao abrir,
# corrige os apontamentos do cubic com um agente e desliga o automático se um humano pedir mudanças.
# Os jobs com agente usam o environment `revisao`, onde fica o CLAUDE_CODE_OAUTH_TOKEN.
# Spec: docs/superpowers/specs/2026-10-23-revisao-auto-merge-design.md
on:
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: revisao-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ligar:
    # O auto-merge é ligado pelo app do GitHub (via agente), não pelo GITHUB_TOKEN: um merge feito pelo
    # GITHUB_TOKEN não dispararia o deploy nem a fumaça.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bot/revisao-de-fatos-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: revisao
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ligar o auto-merge
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          # Token do Claude Code da conta do dono (assinatura Max), guardado no ambiente `revisao`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          prompt: |
            Rode exatamente este comando e nada mais: gh pr merge ${{ github.event.pull_request.number }} --auto --merge
            Depois responda só "feito" ou a mensagem de erro do comando.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 3
            --allowedTools "Bash(gh pr merge:*)"

  desligar:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bot/revisao-de-fatos-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Desligar o auto-merge (um humano pediu mudanças)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --disable-auto

  corrigir:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'cubic-dev-ai[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bot/revisao-de-fatos-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: revisao
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Teto de rodadas de correção
        id: teto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Esta execução inclusa: até 2 rodadas de correção por PR. Passou disso, avisa o dono e para.
          n=$(gh run list --workflow revisao-auto-merge.yml --event pull_request_review --branch "$HEAD" --json databaseId --jq 'length')
          echo "rodadas=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 2 ]; then
            echo "Já houve $n rodadas de correção neste branch: teto atingido."
            gh pr comment "$PR" --body "@juliorenner o agente já corrigiu esta PR 2 vezes e o cubic ainda tem apontamentos; o resto fica com você. _🤖 revisao-auto-merge_"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.teto.outputs.rodadas <= 2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.teto.outputs.rodadas <= 2
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.teto.outputs.rodadas <= 2

      - name: Corrigir os apontamentos do cubic
        if: steps.teto.outputs.rodadas <= 2
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          GH_REPO: ${{ github.repository }}
        with:
          # Token do Claude Code da conta do dono (assinatura Max), guardado no ambiente `revisao`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # O ator do evento é o cubic (bot): sem isto a action recusa rodar.
          allowed_bots: cubic-dev-ai[bot]
          prompt: |
            /corrigir-revisao
            PR: ${{ github.event.pull_request.number }}
          # Sem gh api: o GitHub só é tocado pelo script de threads (ler, responder, resolver) e pelo push
          # do branch atual.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --disallowedTools "Agent,Task"
            --allowedTools "WebFetch,Read,Edit(src/data/afirmacoes.json),Write(docs/superpowers/notes/*),Bash(npm test),Bash(npx tsx scripts/pagina.ts:*),Bash(npx tsx scripts/verificar-fontes.ts),Bash(npx tsx scripts/validar-revisao.ts),Bash(npx tsx scripts/conferir-citacoes.ts:*),Bash(npx tsx scripts/threads-da-revisao.ts:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD)"
